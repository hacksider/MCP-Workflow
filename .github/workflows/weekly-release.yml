name: Weekly desktop release

on:
  schedule:
    - cron: '0 1 * * 1' # Monday 09:00 Asia/Manila (01:00 UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-desktop-release
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-22.04
    outputs:
      release: ${{ steps.plan.outputs.release }}
      head: ${{ steps.plan.outputs.head }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - id: plan
        run: node scripts/release/run.mjs plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        if: steps.plan.outputs.release == 'true'
        with:
          name: release-plan
          path: release-context/plan.json
          if-no-files-found: error

  build:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-22.04
            name: linux-x64
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - os: macos-latest
            name: macos-universal
            target: universal-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.head }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install universal macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 xdg-utils
      - run: npm ci
      - run: npm test
      - name: Build platform installer
        run: npm run desktop:build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          APPLE_SIGNING_IDENTITY: '-'
      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  notes:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 7
    continue-on-error: true # Publishing prepares the free fallback if this entire job fails.
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.head }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8
        with:
          name: release-plan
          path: release-context
      - name: Install current Copilot CLI
        continue-on-error: true
        timeout-minutes: 2
        run: npm install --global @github/copilot@latest
      - name: Summarize changes, with free fallback
        run: node scripts/release/run.mjs notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SUMMARIZER: ${{ vars.RELEASE_SUMMARIZER }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-context/notes.md
          if-no-files-found: error

  publish:
    needs: [plan, build, notes]
    if: always() && needs.plan.outputs.release == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.head }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8
        with:
          name: release-plan
          path: release-context
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: release-notes
          path: release-context
      - name: Guarantee free fallback notes
        shell: bash
        run: |
          if [ ! -s release-context/notes.md ]; then
            RELEASE_SUMMARIZER=local node scripts/release/run.mjs notes
          fi
      - uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          path: release-assets
      - name: Verify assets and publish complete release
        run: node scripts/release/run.mjs publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
