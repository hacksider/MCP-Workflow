[package]
name = "mcp-workflow"
version = "0.11.3"
description = "A local Codex workflow studio"
authors = ["MCP Workflow"]
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
reqwest = {version="0.13",default-features=false,features= ["json", "native-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time"] }

scraper = "0.29"
robotstxt = "0.3"
